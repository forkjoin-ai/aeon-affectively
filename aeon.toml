[[site.faq]]
q = "What is the void walking foundation?"
a = "The 7-layer personality model maps directly to void walking structures. The 58-element personality vector is a complement distribution over a 58-dimensional void boundary, and each personality layer represents a different timescale of void accumulation."

[[site.faq]]
q = "Where does the 7200x compression ratio come from?"
a = "The cascade's overall ratio is the product of the per-layer dimension counts — the jet-engine compressor law where overall equals the product of stage ratios. Reading each layer's *_DIMENSIONS constant: temperament 8, attachment 5, mentalHealth 5, history 6, culture 6 gives 8 · 5 · 5 · 6 · 6 = 7200x. The dynamic Traits and Behaviors layers carry no fixed schema and are excluded."

[[site.faq]]
q = "How is emotion represented?"
a = "Emotion tracking becomes the measurement of where the walker stands relative to the void boundary. Behaviors are gait selection over that boundary; mental health is the kurtosis of the complement distribution."

[[site.faq]]
q = "What does it build on?"
a = "gnosis/void-walker for the core void walking engine, gnosis/behavioral-taxonomy for behavioral loop classification, and shared-ui/aic/types for ProfileBaseline personality types. The cascade module mirrors open-source/aether and the Rust gnosis/gnosis-engine-core crate."

